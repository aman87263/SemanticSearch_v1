# default_limit: API default result count (request limit overrides).
# candidate_limit: vector-search pool size fed into threshold/dedupe/rerank.
# similarity_threshold: minimum cosine similarity to keep a candidate.
# query_expansion_enabled: enable LLM query rewriting/expansion (§14).
#   When true, complex queries are expanded into additional search variants;
#   simple queries skip the LLM entirely (see query_rewriter._is_complex_query).
retrieval:
  default_limit: 3
  candidate_limit: 20
  similarity_threshold: 0.0
  query_expansion_enabled: true
